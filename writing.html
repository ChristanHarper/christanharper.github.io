<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>writing</title>
  <style>
    :root {
      --fuchsia: #FF00C8;
      --cyan:    #00F0FF;
      --blue:    #2850FF;
      --purple:  #AA00FF;
      --bg:      #060606;
      --surface: #0b0b0b;
      --text:    #cccccc;
      --dim:     #444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: var(--cyan); }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    nav {
      position: relative;
      z-index: 1;
      text-align: right;
      padding: 16px 24px 0;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
    }

    nav a {
      text-decoration: none;
      margin-left: 20px;
      transition: color 0.2s;
    }

    .site-header {
      text-align: center;
      padding: 40px 20px 24px;
      position: relative;
      z-index: 1;
    }

    .deco-row {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.6em;
      color: var(--dim);
      user-select: none;
      margin: 6px 0;
    }

    .glitch-wrap {
      position: relative;
      display: inline-block;
      margin: 10px 0;
    }

    .glitch-title {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      letter-spacing: 0.25em;
      font-weight: normal;
      text-transform: lowercase;
      animation: colorShift 10s infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
    }

    .glitch-title::before {
      color: var(--fuchsia);
      animation: glitch-a 4s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 42%, 0 42%);
      opacity: 0;
    }

    .glitch-title::after {
      color: var(--purple);
      animation: glitch-b 4s infinite;
      clip-path: polygon(0 58%, 100% 58%, 100% 100%, 0 100%);
      opacity: 0;
    }

    @keyframes glitch-a {
      0%, 88%, 100% { transform: none; opacity: 0; }
      90%  { transform: translate(-3px, -1px); opacity: 0.85; }
      92%  { transform: translate(2px, 1px);   opacity: 0; }
      94%  { transform: translate(-2px, 0);    opacity: 0.85; }
    }
    @keyframes glitch-b {
      0%, 89%, 100% { transform: none; opacity: 0; }
      91%  { transform: translate(3px, 1px);   opacity: 0.85; }
      93%  { transform: translate(-2px, -1px); opacity: 0; }
      95%  { transform: translate(2px, 0);     opacity: 0.85; }
    }
    @keyframes colorShift {
      0%   { color: var(--cyan);    text-shadow: 0 0 18px var(--cyan); }
      33%  { color: var(--blue);    text-shadow: 0 0 18px var(--blue); }
      66%  { color: var(--fuchsia); text-shadow: 0 0 18px var(--fuchsia); }
      100% { color: var(--cyan);    text-shadow: 0 0 18px var(--cyan); }
    }

    :root { --term-w: 640px; }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    .section-label {
      font-size: 0.78rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      padding-bottom: 10px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--cyan);
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
      user-select: none;
    }

    .writing-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .writing-card {
      /* long-form reading: denser fill and a light blur behind the text */
      background: rgba(11,11,11,0.76);
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      border: 1px solid;
      padding: 28px 28px 22px;
      position: relative;
      transition: box-shadow 0.2s;
    }

    .writing-card:hover {
      box-shadow: 0 0 24px rgba(0,240,255,0.07);
    }

    .writing-title {
      font-size: 0.88rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
      text-transform: lowercase;
    }

    .writing-author {
      font-size: 0.72rem;
      color: var(--dim);
      letter-spacing: 0.25em;
      margin-bottom: 18px;
    }

    .writing-body {
      font-size: 0.88rem;
      color: #bbb;
      white-space: pre-wrap;
      line-height: 1.95;
    }

    .card-actions {
      position: absolute;
      top: 10px; right: 10px;
      display: none;
      gap: 6px;
    }

    .btn-delete, .btn-edit {
      background: none;
      border: 1px solid #222;
      color: #444;
      font-family: inherit;
      font-size: 0.68rem;
      padding: 2px 7px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-delete:hover { color: var(--fuchsia); border-color: var(--fuchsia); }
    .btn-edit:hover   { color: var(--cyan);    border-color: var(--cyan); }

    .no-entries {
      text-align: center;
      color: var(--dim);
      letter-spacing: 0.4em;
      font-size: 0.8rem;
      padding: 60px 0;
    }

    .btn {
      background: transparent;
      border: 1px solid;
      font-family: inherit;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-p { color: var(--purple);  border-color: var(--purple); }
    .btn-f { color: var(--fuchsia); border-color: var(--fuchsia); }
    .btn-c { color: var(--cyan);    border-color: var(--cyan); }

    .btn-p:hover { background: rgba(170,0,255,0.08); box-shadow: 0 0 12px rgba(170,0,255,0.3); }
    .btn-f:hover { background: rgba(255,0,200,0.08); box-shadow: 0 0 12px rgba(255,0,200,0.3); }
    .btn-c:hover { background: rgba(0,240,255,0.08); box-shadow: 0 0 12px rgba(0,240,255,0.3); }

    #login-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      border-style: dashed;
      background: rgba(6,6,6,0.72);
      z-index: 90;
      font-size: 0.78rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background: rgba(9,9,9,0.94);
      border: 1px solid var(--purple);
      box-shadow: 0 0 40px rgba(170,0,255,0.2);
      padding: 36px;
      width: min(340px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-box h3 {
      color: var(--purple);
      font-size: 1rem;
      letter-spacing: 0.4em;
      text-shadow: 0 0 12px var(--purple);
    }

    .modal-box input { width: 100%; }

    .modal-err {
      font-size: 0.78rem;
      color: var(--fuchsia);
      min-height: 14px;
    }

    .modal-btns { display: flex; gap: 10px; }
    .modal-btns .btn { flex: 1; }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      background: rgba(10,10,10,0.82);
      border: 1px solid #222;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 6px rgba(0,240,255,0.25);
    }

    #add-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(9,9,9,0.88);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 24px rgba(0,240,255,0.12);
      padding: 20px;
      width: min(300px, 90vw);
      flex-direction: column;
      gap: 10px;
      z-index: 90;
    }

    #add-panel h3 {
      color: var(--cyan);
      font-size: 0.82rem;
      letter-spacing: 0.35em;
      text-shadow: 0 0 8px var(--cyan);
    }

    #add-panel input[type="text"],
    #add-panel textarea {
      width: 100%;
    }

    #add-panel textarea { min-height: 120px; resize: vertical; }

    .panel-row { display: flex; gap: 8px; }
    .panel-row .btn { flex: 1; font-size: 0.75rem; }

    .panel-status {
      font-size: 0.73rem;
      color: var(--cyan);
      min-height: 12px;
      letter-spacing: 0.1em;
    }
  </style>
  <link rel="stylesheet" href="/assets/term.css">
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <nav class="term-bar">
    <span class="tb-host"><b>christan</b>@harper:~$<span class="tb-cur">_</span></span>
    <span class="tb-links">
      <a href="/home.html">/home</a>
      <a href="/writing.html" class="on">/writing</a>
      <a href="/beings.html">/beings</a>
      <a href="/obol.html">/obol</a>
    </span>
  </nav>


  <section class="wrap">
    <div class="section-label term-label"><span class="n">01</span>archive</div>
    <div class="writing-list" id="entries"></div>
  </section>

  <button class="btn btn-p term-auth" id="login-btn">login</button>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="login-modal" style="display:none">
    <form class="modal-box" id="login-form" autocomplete="on">
      <h3>login</h3>
      <input type="email"    id="email-in" placeholder="email"    name="email" autocomplete="username">
      <input type="password" id="pass-in"  placeholder="password" name="password" autocomplete="current-password">
      <div class="modal-err" id="login-err"></div>
      <div class="modal-btns">
        <button type="submit" class="btn btn-f" id="do-login">login</button>
        <button type="button" class="btn btn-p" id="close-modal">cancel</button>
      </div>
    </form>
  </div>

  <!-- ADD/EDIT PANEL -->
  <div id="add-panel" style="display:none">
    <h3 id="panel-title">new entry</h3>
    <input type="text" id="entry-author" placeholder="author">
    <input type="text" id="entry-title" placeholder="title (optional)">
    <textarea id="entry-body" placeholder="text..."></textarea>
    <div class="panel-status" id="panel-status"></div>
    <div class="panel-row">
      <button class="btn btn-c" id="do-add">add</button>
      <button class="btn btn-p" id="do-logout">logout</button>
    </div>
  </div>

  <!-- BG: interactive ASCII eye -->
  <script src="/assets/eye-bg.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyDXJKlER0Ii-VKkVMEjLKPjx4Tv1-46DXE",
      authDomain:        "my-website-529cc.firebaseapp.com",
      projectId:         "my-website-529cc",
      storageBucket:     "my-website-529cc.firebasestorage.app",
      messagingSenderId: "698883805148",
      appId:             "1:698883805148:web:3519bc8f1775a381830919"
    });

    const db   = firebase.firestore();
    const auth = firebase.auth();

    const esc = s => String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const COLORS = ['#FF00C8','#00F0FF','#2850FF','#AA00FF'];
    const entriesEl = document.getElementById('entries');
    let loggedIn = false;
    let editingId = null;

    db.collection('writing')
      .orderBy('timestamp', 'desc')
      .onSnapshot(snap => {
        entriesEl.innerHTML = '';
        if (snap.empty) {
          entriesEl.innerHTML = '<div class="no-entries term-empty">-- archive empty --</div>';
          return;
        }
        let i = 0;
        snap.forEach(doc => {
          const { title, author, body } = doc.data();
          const color = COLORS[i % 4];
          const rot   = ((Math.random() * 1.2) - 0.6).toFixed(2);
          const card  = document.createElement('div');
          card.className = 'writing-card';
          card.style.borderColor = color;
          card.style.boxShadow   = `0 0 12px ${color}1a`;
          card.style.transform   = `rotate(${rot}deg)`;
          card.innerHTML =
            `<div class="card-actions">
               <button class="btn-edit">edit</button>
               <button class="btn-delete">✕</button>
             </div>` +
            (title  ? `<div class="writing-title" style="color:${color}">${esc(title)}</div>` : '') +
            (author ? `<div class="writing-author">— ${esc(author)}</div>` : '') +
            `<div class="writing-body">${esc(body || '')}</div>`;

          const actions = card.querySelector('.card-actions');
          actions.style.display = loggedIn ? 'flex' : 'none';

          card.querySelector('.btn-delete').addEventListener('click', () => {
            if (confirm('remove this entry?')) db.collection('writing').doc(doc.id).delete();
          });

          card.querySelector('.btn-edit').addEventListener('click', () => {
            editingId = doc.id;
            document.getElementById('entry-author').value = author || '';
            document.getElementById('entry-title').value  = title  || '';
            document.getElementById('entry-body').value   = body   || '';
            document.getElementById('panel-title').textContent = 'edit entry';
            document.getElementById('do-add').textContent = 'save';
            document.getElementById('entry-author').focus();
          });

          entriesEl.appendChild(card);
          i++;
        });
      });

    const loginBtn   = document.getElementById('login-btn');
    const loginModal = document.getElementById('login-modal');
    const addPanel   = document.getElementById('add-panel');

    auth.onAuthStateChanged(user => {
      loggedIn = !!user;
      loginBtn.style.display = user ? 'none'  : 'block';
      addPanel.style.display = user ? 'flex'  : 'none';
      document.querySelectorAll('.card-actions').forEach(b => {
        b.style.display = user ? 'flex' : 'none';
      });
    });

    loginBtn.addEventListener('click', () => {
      loginModal.style.display = 'flex';
      document.getElementById('login-err').textContent = '';
    });

    document.getElementById('close-modal').addEventListener('click', () => {
      loginModal.style.display = 'none';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email-in').value.trim();
      const pass  = document.getElementById('pass-in').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        loginModal.style.display = 'none';
      } catch {
        document.getElementById('login-err').textContent = 'wrong email or password.';
      }
    });


    document.getElementById('do-logout').addEventListener('click', () => auth.signOut());

    function resetPanel() {
      editingId = null;
      document.getElementById('entry-author').value = '';
      document.getElementById('entry-title').value  = '';
      document.getElementById('entry-body').value   = '';
      document.getElementById('panel-title').textContent = 'new entry';
      document.getElementById('do-add').textContent = 'add';
    }

    document.getElementById('do-add').addEventListener('click', async () => {
      const author = document.getElementById('entry-author').value.trim();
      const title  = document.getElementById('entry-title').value.trim();
      const body   = document.getElementById('entry-body').value.trim();
      const status = document.getElementById('panel-status');
      const btn    = document.getElementById('do-add');

      if (!body) return;

      btn.disabled = true;
      status.textContent = editingId ? 'saving...' : 'adding...';

      try {
        if (editingId) {
          await db.collection('writing').doc(editingId).update({ author, title, body });
          status.textContent = 'saved.';
        } else {
          await db.collection('writing').add({
            author, title, body,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          status.textContent = 'added.';
        }

        resetPanel();
        setTimeout(() => status.textContent = '', 2500);
      } catch (err) {
        // Keep what was typed so nothing is lost, and say why it failed.
        console.error(err);
        status.textContent = 'failed: ' + (err && (err.code || err.message) || 'unknown error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
