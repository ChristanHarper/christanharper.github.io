<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>christan harper</title>
  <style>
    :root {
      --fuchsia: #FF00C8;
      --cyan:    #00F0FF;
      --blue:    #2850FF;
      --purple:  #AA00FF;
      --bg:      #060606;
      --surface: #0b0b0b;
      --text:    #cccccc;
      --dim:     #444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: var(--fuchsia); }

    /* ── HEADER ── */
    .site-header {
      text-align: center;
      padding: 48px 20px 24px;
    }

    .deco-row {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.6em;
      color: var(--dim);
      user-select: none;
      margin: 6px 0;
    }

    .glitch-wrap {
      position: relative;
      display: inline-block;
      margin: 10px 0;
    }

    .glitch-title {
      font-size: clamp(2rem, 6vw, 3.8rem);
      letter-spacing: 0.25em;
      font-weight: normal;
      text-transform: lowercase;
      animation: colorShift 10s infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
    }

    .glitch-title::before {
      color: var(--cyan);
      animation: glitch-a 4s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 42%, 0 42%);
      opacity: 0;
    }

    .glitch-title::after {
      color: var(--fuchsia);
      animation: glitch-b 4s infinite;
      clip-path: polygon(0 58%, 100% 58%, 100% 100%, 0 100%);
      opacity: 0;
    }

    @keyframes glitch-a {
      0%, 88%, 100% { transform: none; opacity: 0; }
      90%  { transform: translate(-3px, -1px); opacity: 0.85; }
      92%  { transform: translate(2px, 1px);  opacity: 0; }
      94%  { transform: translate(-2px, 0);   opacity: 0.85; }
    }
    @keyframes glitch-b {
      0%, 89%, 100% { transform: none; opacity: 0; }
      91%  { transform: translate(3px, 1px);  opacity: 0.85; }
      93%  { transform: translate(-2px, -1px); opacity: 0; }
      95%  { transform: translate(2px, 0);    opacity: 0.85; }
    }
    @keyframes colorShift {
      0%   { color: var(--fuchsia); text-shadow: 0 0 18px var(--fuchsia); }
      25%  { color: var(--cyan);    text-shadow: 0 0 18px var(--cyan); }
      50%  { color: var(--blue);    text-shadow: 0 0 18px var(--blue); }
      75%  { color: var(--purple);  text-shadow: 0 0 18px var(--purple); }
      100% { color: var(--fuchsia); text-shadow: 0 0 18px var(--fuchsia); }
    }

    /* ── LAYOUT ── */
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    header, .divider, .login-btn, .modal-overlay, #post-panel {
      position: relative;
      z-index: 1;
    }

    /* ── SECTION HEADERS ── */
    .section-label {
      font-size: 0.78rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid;
      user-select: none;
    }
    .label-cyan    { color: var(--cyan);    border-color: var(--cyan);    text-shadow: 0 0 8px var(--cyan); }
    .label-fuchsia { color: var(--fuchsia); border-color: var(--fuchsia); text-shadow: 0 0 8px var(--fuchsia); transform: rotate(-0.4deg); display: inline-block; }

    /* ── CHAT ── */
    .chat-section { margin: 56px auto 0; }

    .messages-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom: none;
      /* translucent so the eye shows through; the text stays crisp */
      background: rgba(4,4,4,0.66);
      padding: 12px 14px;
    }

    /* IRC-style lines: [time] <nick> text */
    .msg {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 2px 0;
      font-size: 0.86rem;
      line-height: 1.55;
    }
    .msg-time { flex: none; color: #555; }
    .msg-name { flex: none; }
    .msg-text { flex: 1; min-width: 0; color: #d0d0d0; overflow-wrap: anywhere; }

    .msg-del {
      flex: none;
      background: none;
      border: none;
      color: #333;
      font-family: inherit;
      font-size: 0.68rem;
      cursor: pointer;
      padding: 0 4px;
      display: none;
      transition: color 0.15s;
    }
    .msg-del:hover { color: var(--fuchsia); }

    .chat-inputs {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(6,6,6,0.86);
    }
    .chat-inputs input[type="text"] { background: transparent; border: none; box-shadow: none; }
    .chat-inputs:focus-within { border-color: rgba(0,240,255,0.5); }
    .chat-prompt { color: var(--fuchsia); padding-left: 4px; user-select: none; }
    .chat-inputs #send-btn { border: none; border-left: 1px solid rgba(255,255,255,0.1); align-self: stretch; }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      background: rgba(10,10,10,0.82);
      border: 1px solid #222;
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 6px rgba(0,240,255,0.25);
    }

    #chat-name { width: 120px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.1) !important; color: #888; }
    #chat-msg  { flex: 1; min-width: 0; }

    @media (max-width: 520px) {
      .msg { flex-wrap: wrap; gap: 0 8px; }
      .msg-text { flex-basis: 100%; padding-left: 1ch; }
      #chat-name { width: 84px; }
    }

    /* ── WEIRD DIVIDER ── */
    .divider {
      text-align: center;
      margin: 40px auto;
      max-width: 920px;
      padding: 0 20px;
    }
    .divider-line {
      color: var(--dim);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      display: block;
      user-select: none;
    }
    .divider-text {
      display: inline-block;
      margin: 6px 0;
      font-size: 0.78rem;
      letter-spacing: 0.4em;
      animation: colorShift 14s infinite reverse;
      font-style: italic;
    }

    /* ── BLOG ── */
    .blog-section { margin: 0 auto; }

    /* The log: one long column, newest first. */
    .log-list {
      background: rgba(4,4,4,0.66);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 18px;
      font-size: 0.86rem;
      line-height: 1.65;
    }
    .log-entry { position: relative; padding: 16px 0; }
    .log-entry + .log-entry { border-top: 1px dashed rgba(255,255,255,0.08); }
    .le-date { color: #666; font-size: 0.76rem; letter-spacing: 0.08em; }
    .le-title { margin-top: 6px; color: #f0f0f0; }
    .le-body { margin-top: 6px; color: #a8a8a8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .log-entry .btn-delete { top: 16px; right: 0; }
    @media (max-width: 520px) {
      .log-list { padding: 4px 12px; }
    }
    #posts { margin-bottom: 14px; }
    #posts[hidden] { display: none; }

    /* Build log: one line per entry, newest first, the date shown once per day. */
    .build-log {
      background: rgba(4,4,4,0.66);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 18px;
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .bl-row {
      display: grid;
      grid-template-columns: 10.5ch 5.5ch 2ch 1fr;
      gap: 0 1ch;
      align-items: baseline;
    }
    .bl-row.newday { margin-top: 6px; }
    .bl-row:first-child { margin-top: 0; }
    .bl-date { color: #777; }
    .bl-time { color: #4a4a4a; }
    .bl-tag.b { color: var(--cyan); }
    .bl-tag.l { color: var(--fuchsia); }
    .bl-text { color: #c8c8c8; overflow-wrap: anywhere; }
    .bl-row.l .bl-text { color: #9a9a9a; }
    .bl-more {
      margin-top: 10px;
      background: none;
      border: none;
      padding: 0;
      color: #777;
      font: inherit;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    .bl-more:hover, .bl-more:focus-visible { color: #e6e6e6; outline: none; }
    .term-label .key { margin-left: auto; letter-spacing: 0.12em; text-transform: none; font-size: 0.7rem; color: #777; }
    .term-label .key b { font-weight: normal; }
    @media (max-width: 520px) {
      .build-log { padding: 8px 12px; font-size: 0.78rem; }
      .bl-row { grid-template-columns: 10.5ch 2ch 1fr; }
      .bl-time { display: none; }
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }

    .post-card {
      background: rgba(11,11,11,0.6);
      border: 1px solid;
      padding: 16px;
      position: relative;
      transition: box-shadow 0.2s;
    }

    .post-card:hover {
      box-shadow: 0 0 20px rgba(255,255,255,0.06);
    }

.post-title {
      font-size: 0.92rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .post-body {
      font-size: 0.82rem;
      color: #999;
      white-space: pre-wrap;
      line-height: 1.65;
    }

    .post-footer {
      margin-top: 10px;
      font-size: 0.68rem;
      color: var(--dim);
    }

    .btn-delete {
      position: absolute;
      top: 8px; right: 8px;
      background: none;
      border: 1px solid #222;
      color: #444;
      font-family: inherit;
      font-size: 0.68rem;
      padding: 2px 7px;
      cursor: pointer;
      display: none;
      transition: all 0.15s;
    }
    .btn-delete:hover { color: var(--fuchsia); border-color: var(--fuchsia); }

    .no-posts {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--dim);
      letter-spacing: 0.4em;
      font-size: 0.8rem;
      padding: 50px 0;
    }

    /* ── BUTTONS ── */
    .btn {
      background: transparent;
      border: 1px solid;
      font-family: inherit;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-c  { color: var(--cyan);    border-color: var(--cyan); }
    .btn-f  { color: var(--fuchsia); border-color: var(--fuchsia); }
    .btn-p  { color: var(--purple);  border-color: var(--purple); }

    .btn-c:hover { background: rgba(0,240,255,0.08); box-shadow: 0 0 12px rgba(0,240,255,0.3); }
    .btn-f:hover { background: rgba(255,0,200,0.08); box-shadow: 0 0 12px rgba(255,0,200,0.3); }
    .btn-p:hover { background: rgba(170,0,255,0.08); box-shadow: 0 0 12px rgba(170,0,255,0.3); }

    /* ── LOGIN BTN (fixed) ── */
    #login-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      border-style: dashed;
      background: rgba(6,6,6,0.72);
      z-index: 90;
      font-size: 0.78rem;
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-box {
      background: rgba(9,9,9,0.94);
      border: 1px solid var(--purple);
      box-shadow: 0 0 40px rgba(170,0,255,0.2);
      padding: 36px;
      width: min(340px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-box h3 {
      color: var(--purple);
      font-size: 1rem;
      letter-spacing: 0.4em;
      text-shadow: 0 0 12px var(--purple);
    }

    .modal-box input { width: 100%; }

    .modal-err {
      font-size: 0.78rem;
      color: var(--fuchsia);
      letter-spacing: 0.1em;
      min-height: 14px;
    }

    .modal-btns { display: flex; gap: 10px; }
    .modal-btns .btn { flex: 1; }

    /* ── POST PANEL (when logged in) ── */
    #post-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(9,9,9,0.88);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid var(--fuchsia);
      box-shadow: 0 0 24px rgba(255,0,200,0.15);
      padding: 20px;
      width: min(300px, 90vw);
      flex-direction: column;
      gap: 10px;
      z-index: 90;
    }

    #post-panel h3 {
      color: var(--fuchsia);
      font-size: 0.82rem;
      letter-spacing: 0.35em;
      text-shadow: 0 0 8px var(--fuchsia);
    }

    #post-panel textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
    }

    #post-panel input[type="text"] { width: 100%; }

    .panel-row { display: flex; gap: 8px; }
    .panel-row .btn { flex: 1; font-size: 0.75rem; }

    .upload-status {
      font-size: 0.73rem;
      color: var(--cyan);
      min-height: 12px;
      letter-spacing: 0.1em;
    }
  </style>
  <link rel="stylesheet" href="/assets/term.css">
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- NAV -->
  <nav class="term-bar">
    <span class="tb-host"><b>christan</b>@harper:~$<span class="tb-cur">_</span></span>
    <span class="tb-links">
      <a href="/home.html" class="on">/home</a>
      <a href="/writing.html">/writing</a>
      <a href="/beings.html">/beings</a>
      <a href="/obol.html">/obol</a>
    </span>
  </nav>

  <!-- CHAT -->
  <section class="chat-section wrap">
    <div class="section-label term-label"><span class="n">01</span>channel</div>
    <div class="messages-box" id="messages"></div>
    <div class="chat-inputs">
      <input type="text" id="chat-name" name="chat-nick" placeholder="handle" maxlength="30" aria-label="handle" autocomplete="off" data-1p-ignore data-lpignore="true">
      <span class="chat-prompt" aria-hidden="true">&gt;</span>
      <input type="text" id="chat-msg" name="chat-line" maxlength="500" aria-label="message" autocomplete="off" data-1p-ignore data-lpignore="true">
      <button class="btn btn-c" id="send-btn">send</button>
    </div>
  </section>

  <div class="divider" aria-hidden="true"></div>

  <!-- BLOG -->
  <section class="blog-section wrap">
    <div class="section-label term-label"><span class="n">02</span>log<span class="key"><b style="color:var(--cyan)">B</b> built &nbsp;<b style="color:var(--fuchsia)">L</b> learned</span></div>
    <div class="log-list" id="posts" hidden></div>
    <div class="build-log" id="buildlog"></div>
  </section>

  <!-- LOGIN BUTTON -->
  <button class="btn btn-p term-auth" id="login-btn">login</button>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="login-modal" style="display:none">
    <form class="modal-box" id="login-form" autocomplete="on">
      <h3>login</h3>
      <input type="email"    id="email-in" placeholder="email"    name="email" autocomplete="username">
      <input type="password" id="pass-in"  placeholder="password" name="password" autocomplete="current-password">
      <div class="modal-err" id="login-err"></div>
      <div class="modal-btns">
        <button type="submit" class="btn btn-f" id="do-login">login</button>
        <button type="button" class="btn btn-p" id="close-modal">cancel</button>
      </div>
    </form>
  </div>

  <!-- POST PANEL -->
  <div id="post-panel" style="display:none">
    <h3>new post</h3>
    <input type="text" id="post-title"   placeholder="title">
    <textarea          id="post-content" placeholder="entry..."></textarea>
    <div class="upload-status" id="up-status"></div>
    <div class="panel-row">
      <button class="btn btn-f" id="do-post">post</button>
      <button class="btn btn-c" id="do-logout">logout</button>
    </div>
  </div>

  <!-- BG: interactive ASCII eye -->
  <script src="/assets/eye-bg.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyDXJKlER0Ii-VKkVMEjLKPjx4Tv1-46DXE",
      authDomain:        "my-website-529cc.firebaseapp.com",
      projectId:         "my-website-529cc",
      storageBucket:     "my-website-529cc.firebasestorage.app",
      messagingSenderId: "698883805148",
      appId:             "1:698883805148:web:3519bc8f1775a381830919"
    });

    const db   = firebase.firestore();
    const auth = firebase.auth();

    // ── UTILS ────────────────────────────────────────────
    const esc = s => String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const COLORS = ['#FF00C8','#00F0FF','#2850FF','#AA00FF'];
    const nameColors = {};
    function colorFor(name) {
      if (!nameColors[name]) nameColors[name] = COLORS[Object.keys(nameColors).length % 4];
      return nameColors[name];
    }

    function fmtTime(ts) {
      if (!ts) return '';
      return ts.toDate().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
    }

    // ── CHAT ─────────────────────────────────────────────
    const msgBox = document.getElementById('messages');

    db.collection('messages')
      .orderBy('timestamp')
      .limitToLast(200)
      .onSnapshot(snap => {
        msgBox.innerHTML = '';
        snap.forEach(doc => {
          const { username, text, timestamp } = doc.data();
          const name  = username || 'anonymous';
          const color = colorFor(name);
          const div   = document.createElement('div');
          div.className = 'msg';
          div.innerHTML =
            `<span class="msg-time">[${fmtTime(timestamp) || '--:--'}]</span>` +
            `<span class="msg-name" style="color:${color}">&lt;${esc(name)}&gt;</span>` +
            `<span class="msg-text">${esc(text)}</span>` +
            `<button class="msg-del">✕</button>`;

          const del = div.querySelector('.msg-del');
          del.style.display = loggedIn ? 'inline' : 'none';
          del.addEventListener('click', () => db.collection('messages').doc(doc.id).delete());

          msgBox.appendChild(div);
        });
        msgBox.scrollTop = msgBox.scrollHeight;
      });

    function sendMsg() {
      const name = document.getElementById('chat-name').value.trim() || 'anonymous';
      const text = document.getElementById('chat-msg').value.trim();
      if (!text) return;
      db.collection('messages').add({
        username: name,
        text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('chat-msg').value = '';
    }

    document.getElementById('send-btn').addEventListener('click', sendMsg);
    document.getElementById('chat-msg').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

    // ── LOG ──────────────────────────────────────────────
    const pad2 = n => String(n).padStart(2, '0');
    function fmtStamp(ts) {
      if (!ts) return 'pending';
      const d = ts.toDate();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    const postsEl = document.getElementById('posts');
    let loggedIn  = false;

    db.collection('posts')
      .orderBy('timestamp','desc')
      .onSnapshot(snap => {
        postsEl.innerHTML = '';
        postsEl.hidden = snap.empty;
        if (snap.empty) return;
        snap.forEach(doc => {
          const { title, content, timestamp } = doc.data();
          const card = document.createElement('article');
          card.className = 'log-entry';
          card.innerHTML =
            `<button class="btn-delete">✕</button>` +
            `<div class="le-date">${fmtStamp(timestamp)}</div>` +
            (title   ? `<div class="le-title">${esc(title)}</div>` : '') +
            (content ? `<div class="le-body">${esc(content)}</div>` : '');

          const del = card.querySelector('.btn-delete');
          del.style.display = loggedIn ? 'block' : 'none';
          del.addEventListener('click', () => {
            if (confirm('delete this entry?')) db.collection('posts').doc(doc.id).delete();
          });

          postsEl.appendChild(card);
        });
      });

    // ── BUILD LOG ────────────────────────────────────────
    // Lines from /assets/buildlog.txt: "YYYY-MM-DD HH:MM  B|L  text".
    // Add new lines to that file; they show up here newest first.
    const buildEl = document.getElementById('buildlog');
    const BL_FIRST = 40;
    fetch('/assets/buildlog.txt', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => {
        const rows = [];
        for (const raw of txt.split('\n')) {
          const m = raw.trimEnd().match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}|--:--)\s+([BL])\s+(.+)$/);
          if (m) rows.push({ date: m[1], time: m[2], tag: m[3], text: m[4].trim() });
        }
        rows.reverse();
        let shown = 0;
        function renderRows(upto) {
          const frag = document.createDocumentFragment();
          for (let i = shown; i < upto && i < rows.length; i++) {
            const r = rows[i], prev = rows[i - 1];
            const newDay = !prev || prev.date !== r.date;
            const row = document.createElement('div');
            row.className = 'bl-row ' + r.tag.toLowerCase() + (newDay ? ' newday' : '');
            const cells = [
              ['bl-date', newDay ? r.date : ''],
              ['bl-time', r.time],
              ['bl-tag ' + r.tag.toLowerCase(), r.tag],
              ['bl-text', r.text],
            ];
            for (const [cls, text] of cells) {
              const span = document.createElement('span');
              span.className = cls;
              span.textContent = text;
              row.appendChild(span);
            }
            frag.appendChild(row);
          }
          shown = Math.min(upto, rows.length);
          const more = buildEl.querySelector('.bl-more');
          if (more) more.remove();
          buildEl.appendChild(frag);
          if (shown < rows.length) {
            const btn = document.createElement('button');
            btn.className = 'bl-more';
            btn.textContent = `show all ${rows.length}`;
            btn.addEventListener('click', () => renderRows(rows.length));
            buildEl.appendChild(btn);
          }
        }
        if (!rows.length) { buildEl.innerHTML = '<div class="term-empty" style="padding:8px 0">-- log empty --</div>'; return; }
        renderRows(BL_FIRST);
      })
      .catch(() => { buildEl.hidden = true; });

    // ── AUTH ─────────────────────────────────────────────
    const loginBtn   = document.getElementById('login-btn');
    const loginModal = document.getElementById('login-modal');
    const postPanel  = document.getElementById('post-panel');

    auth.onAuthStateChanged(user => {
      loggedIn = !!user;
      loginBtn.style.display  = user ? 'none'  : 'block';
      postPanel.style.display = user ? 'flex'  : 'none';
      document.querySelectorAll('.btn-delete').forEach(b => {
        b.style.display = user ? 'block' : 'none';
      });
      document.querySelectorAll('.msg-del').forEach(b => {
        b.style.display = user ? 'inline' : 'none';
      });
    });

    loginBtn.addEventListener('click', () => {
      loginModal.style.display = 'flex';
      document.getElementById('login-err').textContent = '';
    });

    document.getElementById('close-modal').addEventListener('click', () => {
      loginModal.style.display = 'none';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email-in').value.trim();
      const pass  = document.getElementById('pass-in').value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        loginModal.style.display = 'none';
      } catch {
        document.getElementById('login-err').textContent = 'wrong email or password.';
      }
    });


    document.getElementById('do-logout').addEventListener('click', () => auth.signOut());

    // ── POST CREATION ─────────────────────────────────────
    document.getElementById('do-post').addEventListener('click', async () => {
      const title   = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const status  = document.getElementById('up-status');
      const btn     = document.getElementById('do-post');

      if (!title && !content) return;

      btn.disabled = true;
      status.textContent = 'posting...';

      try {
        await db.collection('posts').add({
          title, content,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('post-title').value   = '';
        document.getElementById('post-content').value = '';
        status.textContent = 'posted.';
        setTimeout(() => status.textContent = '', 2500);
      } catch (err) {
        // Keep what was typed so nothing is lost, and say why it failed.
        console.error(err);
        status.textContent = 'failed: ' + (err && (err.code || err.message) || 'unknown error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
