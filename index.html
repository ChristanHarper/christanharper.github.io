<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>christan harper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    /* The way in sits in the open sky above the eye. */
    .enter {
      position: fixed;
      left: 50%;
      top: clamp(28px, 9vh, 96px);
      transform: translateX(-50%);
      z-index: 1;
      font: bold clamp(1.6rem, 5.2vw, 3.4rem) / 1 monospace;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      padding: 0.2em 0.35em;
      text-shadow: 0 0 14px rgba(255, 0, 200, 0.55);
      transition: color 0.2s, text-shadow 0.2s;
    }
    .enter:hover, .enter:focus-visible {
      color: #00F0FF;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.8);
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <a class="enter" href="/home.html">[Enter Site]</a>
  <script src="/assets/eye-bg.js"></script>
</body>
</html>
